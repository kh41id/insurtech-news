<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insurtech Morning Brief</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14202b;--muted:#5d6b78;--line:#e2e6ea;--accent:#0b7a4b;--tag:#e6f4ec}
@media (prefers-color-scheme:dark){:root{--bg:#10161c;--card:#18212a;--text:#e8edf1;--muted:#93a1ad;--line:#26323d;--accent:#3ecf8e;--tag:#173326}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header,main{max-width:860px;margin:0 auto;padding:20px 16px}
h1{margin:0;font-size:1.5rem}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button,input{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:8px 14px}
button{cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input{flex:1;min-width:160px}
article{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
article a{color:var(--text);font-weight:600;text-decoration:none;line-height:1.35}
article a:hover{color:var(--accent)}
.meta{font-size:.8rem;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{background:var(--tag);color:var(--accent);padding:2px 8px;border-radius:99px;font-weight:600}
p{margin:8px 0 0;color:var(--muted);font-size:.9rem}
.note{color:var(--muted);text-align:center;padding:30px 0}
</style>
</head>
<body>
<header>
  <h1>Insurtech Morning Brief</h1>
  <div class="sub" id="updated">Loading…</div>
  <div class="bar">
    <button data-r="all" class="on">All</button>
    <button data-r="local">Bangladesh</button>
    <button data-r="global">Global</button>
    <input id="q" type="search" placeholder="Search headlines…">
  </div>
</header>
<main id="list"><div class="note">Fetching the latest news…</div></main>
<script>
let all = [], region = 'all';
const list = document.getElementById('list');

function ago(d){
  if(!d) return '';
  const h = (Date.now() - new Date(d)) / 36e5;
  if(h < 1) return Math.max(1, Math.round(h*60)) + ' min ago';
  if(h < 24) return Math.round(h) + ' hr ago';
  return Math.round(h/24) + ' d ago';
}

function render(){
  const q = document.getElementById('q').value.toLowerCase();
  const rows = all.filter(x => (region==='all' || x.region===region) && x.title.toLowerCase().includes(q));
  list.textContent = '';
  if(!rows.length){ list.innerHTML = '<div class="note">No stories found.</div>'; return; }
  rows.forEach(x => {
    const a = document.createElement('article');
    const link = document.createElement('a');
    link.textContent = x.title;
    link.href = /^https?:\/\//.test(x.link) ? x.link : '#';
    link.target = '_blank'; link.rel = 'noopener noreferrer';
    const meta = document.createElement('div'); meta.className = 'meta';
    const tag = document.createElement('span'); tag.className = 'tag';
    tag.textContent = x.region === 'local' ? 'Bangladesh' : 'Global';
    const src = document.createElement('span'); src.textContent = x.source + ' · ' + ago(x.date);
    meta.append(tag, src);
    a.append(link, meta);
    if(x.snippet && !x.source.startsWith('Google')){ const p = document.createElement('p'); p.textContent = x.snippet; a.append(p); }
    list.append(a);
  });
}

document.querySelectorAll('button[data-r]').forEach(b => b.onclick = () => {
  document.querySelectorAll('button[data-r]').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); region = b.dataset.r; render();
});
document.getElementById('q').oninput = render;

fetch('/api/news').then(r => r.json()).then(d => {
  all = d.items;
  document.getElementById('updated').textContent =
    all.length + ' stories · updated ' + new Date(d.updated).toLocaleString() +
    (d.failed.length ? ' · ' + d.failed.length + ' source(s) unavailable' : '');
  render();
}).catch(() => { list.innerHTML = '<div class="note">Could not load news. Try refreshing.</div>'; });
</script>
</body>
</html>
